# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:

---
include:
  - board: nice_nano@2.0.0//zmk
    shield: temper_left nice_view_adapter nice_view_custom
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_LV_Z_MEM_POOL_SIZE=8192 -DCONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
    artifact-name: temper-left-niceview-bongo
  - board: nice_nano@2.0.0//zmk
    shield: temper_right nice_view_adapter nice_view right_status
    cmake-args: -DCONFIG_LV_Z_MEM_POOL_SIZE=8192 -DCONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
    artifact-name: temper-right-niceview-status
  - board: nice_nano@2.0.0//zmk
    shield: settings_reset
    artifact-name: settings-reset
