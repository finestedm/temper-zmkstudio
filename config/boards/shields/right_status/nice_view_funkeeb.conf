# Enable the display using the same runtime settings as ZMK's native nice!view shield.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096

# Use the nRF52840's maximum Bluetooth transmit power for improved range.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
